name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    # A follow-up task cleaned up the ~580 pre-existing violations this job
    # used to continue-on-error past; `ruff check .` is now a real, blocking
    # gate. The one line ruff itself cannot wrap (a long ArduPilot wiki URL
    # inside Command's RST docstring, in dronekit/mission.py) is scoped out
    # via pyproject.toml's [tool.ruff.lint.per-file-ignores], not this flag.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    # PROVISIONAL: best-effort only. The codebase has no inline type annotations
    # and this is the first time mypy has ever run in CI here, so a hard gate
    # would be premature even though it currently passes cleanly with the
    # permissive [tool.mypy] settings in pyproject.toml (ignore_missing_imports).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: mypy dronekit/
        run: mypy dronekit/

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.14: left out deliberately. Support in actions/setup-python is not
        # something this task could reliably verify (couldn't run GitHub Actions
        # locally, and available research was inconsistent) - add it in a
        # follow-up once it's confirmed to actually work here.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: pytest (unit tests; SITL tests skip without DRONEKIT_TEST_CONNECTION)
        run: pytest dronekit/test -q

  sitl:
    name: sitl (ArduPilot SITL, best-effort)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Uses ArduPilot's own official prebuilt SITL binary
    # (firmware.ardupilot.org/Copter/stable/SITL_x86_64_linux_gnu/arducopter -
    # verified reachable, HTTP 200, ~7 MB) instead of cloning the whole
    # ardupilot repo with submodules and building it with waf, which used to
    # take 15-25+ minutes here and was the reason this job needed a 45-minute
    # timeout. "stable" is ArduPilot's floating current-stable-release alias
    # (this firmware server does not publish SITL binaries under fixed
    # per-tag paths, only under the stable/latest/beta channels - a fixed
    # Copter-4.6.3 SITL binary path returns 404), so the exact ArduCopter
    # version this job tests against can drift forward release to release.
    # That's an accepted trade-off for how much faster and simpler this makes
    # the job; still continue-on-error since a live pytest run against it has
    # never actually been observed to pass in this repo's CI yet.
    #
    # Architecture, worked out the hard way across many real CI runs: the
    # arducopter binary's default SERIAL0 (TCP port 5760) accepts exactly
    # ONE TCP connection for the entire life of the process - confirmed
    # directly from logs (one real connection got ConnectionResetError,
    # every attempt after it got ConnectionRefusedError). That's fatal for
    # this test suite's `vehicle` fixture, which is function-scoped and
    # opens a fresh connection per test.
    #
    # Tried and abandoned, in order: talking raw TCP directly to SERIAL0
    # (only one test could ever connect); a hand-rolled TCP<->UDP relay
    # multiplexing the single TCP slot onto UDP (the relay's own TCP
    # connection to arducopter died almost immediately, root cause never
    # conclusively identified after fixing log spam, sending a heartbeat,
    # and adding thread-safety locking - each verified correct and
    # individually insufficient); a full MAVProxy install in front of it
    # (its CLI entry point imports `wx` unconditionally at module load, even
    # with --daemon --non-interactive - a known, still-open upstream issue,
    # ArduPilot/MAVProxy#592, reproduced locally, not assumed).
    #
    # What actually works: arducopter has a second, independent UART, and
    # --serial1=udpclient:127.0.0.1:14550 gives it its own dedicated UDP
    # output, entirely separate from SERIAL0's TCP port (confirmed by
    # reading ArduPilot's own source - libraries/AP_HAL_SITL/UARTDriver.cpp's
    # _begin(), which parses "udpclient:host:port" as a distinct device type
    # from "tcp"/"tcpclient" - the "one connection" limit is specific to
    # SERIAL0's TCP accept() loop and does not apply here at all: this is a
    # plain UDP socket that connect()s to a fixed peer and send()s to it,
    # with no per-connection state to exhaust). No relay, no MAVProxy, no
    # wx, no from-source build - the prebuilt binary already does this
    # natively.
    #
    # One catch found only by reading _tcp_start_connection() itself:
    # SERIAL0's default device string is "tcp:0:wait", and that trailing
    # ":wait" makes _begin() call a BLOCKING accept() right there, on the
    # same thread that sequentially begin()s every other serial port
    # afterwards. With no relay/probe left to connect to port 5760 (this is
    # deliberate now - see above), that accept() blocks forever, so SERIAL1
    # (and its --serial1=udpclient flag) never even gets initialized -
    # confirmed by arducopter.log stopping dead at "Waiting for connection
    # ...." with no later "UDP connection ..." line, in two real CI runs.
    # Fixed by also overriding --serial0=tcp:0 (no ":wait"): SERIAL0 still
    # listens (harmless, unused), but startup no longer blocks on it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dronekit2 with dev dependencies
        run: pip install -e ".[dev]"

      - name: Download prebuilt ArduCopter SITL binary and its default params
        run: |
          curl -fsSL -o arducopter \
            https://firmware.ardupilot.org/Copter/stable/SITL_x86_64_linux_gnu/arducopter
          chmod +x arducopter
          # sim_vehicle.py always loads this file for Copter; bypassing it
          # (as this job does) left FRAME_CLASS/FRAME_TYPE unset, so the
          # autopilot refused to arm at all ("PreArm: Motors: Check frame
          # class and type") - confirmed locally: 3 arming-dependent tests
          # failed with it missing, passed once it was loaded.
          curl -fsSL -o copter.parm \
            https://raw.githubusercontent.com/ArduPilot/ardupilot/master/Tools/autotest/default_params/copter.parm

      - name: Launch ArduCopter SITL in the background
        run: |
          # stdbuf -oL forces line-buffered stdout: without it, a C/C++
          # program writing to a redirected file (not a tty) typically gets
          # fully-buffered stdio, so lines like "Connection on serial port
          # 5760" can sit in the process's memory for a long time before
          # actually landing in arducopter.log - confirmed against a real
          # run where that exact line only appeared in the log dump at the
          # very end of the job, well after steps that needed to observe it
          # in real time had already timed out. This makes the log file a
          # trustworthy real-time signal instead of a delayed one.
          nohup stdbuf -oL -eL ./arducopter --model quad --instance 0 --speedup 1 \
            --home -35.363261,149.165230,584,353 --wipe \
            --defaults copter.parm \
            --serial0=tcp:0 \
            --serial1=udpclient:127.0.0.1:14550 \
            > /tmp/arducopter.log 2>&1 &
          disown

      - name: Wait for SITL's log to show SERIAL1's UDP output is up
        # Makes zero network connections of its own - see the job-level
        # comment above for why that matters here. Greps the binary's own
        # log for the "UDP connection ..." line _begin() prints once it's
        # parsed --serial1 and connect()ed the UDP socket, so the
        # heartbeat-wait step (next) doesn't race that setup.
        #
        # PROVISIONAL/diagnostic: two real CI runs both stopped dead at
        # "Smoothing reset at 0.001" (the first FDM physics tick - so the
        # process genuinely reached its main loop, this isn't stuck in
        # setup()) and never printed the UDP connection line even after a
        # full 180s, while a local Docker run with the identical binary and
        # flags reached it in under 1s. That's a real behavioral difference
        # between this runner and Docker, not just slowness - so instead of
        # continuing to guess timeout values, this now attaches strace to
        # the still-running process on timeout and dumps what syscall it's
        # actually blocked in, to diagnose from evidence next run.
        run: |
          deadline=$((SECONDS + 30))
          while [ $SECONDS -lt $deadline ]; do
            if grep -q "UDP connection 127.0.0.1:14550" /tmp/arducopter.log 2>/dev/null; then
              echo "SITL's SERIAL1 UDP output is up:"
              cat /tmp/arducopter.log
              exit 0
            fi
            sleep 1
          done
          echo "SITL never printed 'UDP connection 127.0.0.1:14550' within 30s:" >&2
          cat /tmp/arducopter.log >&2 || true
          pid=$(pgrep -x arducopter || true)
          if [ -n "$pid" ]; then
            command -v strace >/dev/null 2>&1 || sudo apt-get install -y -qq strace >&2
            echo "Attaching strace to pid $pid for 5s to see what it's blocked on:" >&2
            sudo strace -f -tt -p "$pid" -o /tmp/strace.log &
            strace_pid=$!
            sleep 5
            kill "$strace_pid" 2>/dev/null || true
            wait "$strace_pid" 2>/dev/null || true
            cat /tmp/strace.log >&2 || true
          fi
          exit 1

      - name: Wait for a MAVLink heartbeat over UDP (127.0.0.1:14550)
        # arducopter itself is sending this, straight off --serial1 - no
        # relay in between. UDP has no connection limit, so a plain
        # wait_heartbeat() retry loop here is safe - it doesn't consume
        # anything pytest needs afterwards.
        run: |
          python -c "
          import sys, time
          from pymavlink import mavutil
          deadline = time.time() + 60
          conn = mavutil.mavlink_connection('udpin:127.0.0.1:14550')
          msg = None
          while time.time() < deadline and msg is None:
              msg = conn.wait_heartbeat(timeout=5)
          if msg is None:
              print('Timed out waiting for a heartbeat over UDP', file=sys.stderr)
              sys.exit(1)
          print('Got heartbeat over UDP:', msg)
          conn.close()
          "

      - name: pytest -m sitl against live SITL
        env:
          DRONEKIT_TEST_CONNECTION: "udp:127.0.0.1:14550"
        run: pytest dronekit/test -q -m sitl

      - name: SITL log (always, for debugging)
        if: always()
        run: cat /tmp/arducopter.log || true

  docs:
    name: docs (sphinx)
    runs-on: ubuntu-latest
    # sphinx_3dr_theme (dead) was replaced with furo in E8; the two warnings
    # `-W` used to trip on (a stale :emphasize-lines: range in
    # dronekit/mission.py's CommandSequence docstring, and a toctree entry
    # for docs/examples/performance_test.rst that didn't exist yet) are both
    # fixed, so this is now a real, blocking gate rather than provisional.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: pip install -e ".[docs]"

      - name: sphinx-build
        run: sphinx-build -W -b html docs docs/_build/html
