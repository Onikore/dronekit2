name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dronekit2/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No API token is stored
      # as a secret - PyPI is configured to trust this repo/workflow directly.
      id-token: write
      contents: read
    steps:
      - name: Verify ci.yml passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        # Best-effort gate: releases are tagged commits, and ci.yml only runs
        # on push/pull_request (not on `release`), so there's no native GitHub
        # Actions `needs:` dependency that can span the two workflows. Instead
        # this queries the REST API for the most recent completed ci.yml run
        # against this exact commit SHA and checks the run's own overall
        # conclusion - which GitHub Actions already computes as a failure if
        # any of its jobs failed (lint, typecheck, the full test matrix, sitl,
        # docs are all real gates now, none left continue-on-error), so this
        # doesn't need to enumerate job names itself. This has not been
        # exercised against a real GitHub Actions run - if it turns out to be
        # unreliable (e.g. the release commit was never pushed to main and so
        # never ran ci.yml at all), the documented fallback is procedural:
        # only publish releases tagged from a commit where ci.yml is green on
        # main.
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "Looking for a completed ci.yml run for commit $SHA..."
          RESULT=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed" \
            --jq '(.workflow_runs[0] // empty) | {id, conclusion}')
          if [ -z "$RESULT" ]; then
            echo "::error::No completed ci.yml run found for commit $SHA. Only publish releases tagged from a commit where ci.yml has run and passed on main."
            exit 1
          fi
          CONCLUSION=$(echo "$RESULT" | jq -r '.conclusion')
          RUN_ID=$(echo "$RESULT" | jq -r '.id')
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::ci.yml run $RUN_ID for commit $SHA did not succeed (conclusion: $CONCLUSION). Refusing to publish."
            exit 1
          fi
          echo "ci.yml run $RUN_ID succeeded for $SHA."

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
