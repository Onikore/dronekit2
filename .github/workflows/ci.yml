name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    # A follow-up task cleaned up the ~580 pre-existing violations this job
    # used to continue-on-error past; `ruff check .` is now a real, blocking
    # gate. The one line ruff itself cannot wrap (a long ArduPilot wiki URL
    # inside Command's RST docstring, in dronekit/mission.py) is scoped out
    # via pyproject.toml's [tool.ruff.lint.per-file-ignores], not this flag.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    # PROVISIONAL: best-effort only. The codebase has no inline type annotations
    # and this is the first time mypy has ever run in CI here, so a hard gate
    # would be premature even though it currently passes cleanly with the
    # permissive [tool.mypy] settings in pyproject.toml (ignore_missing_imports).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: mypy dronekit/
        run: mypy dronekit/

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.14: left out deliberately. Support in actions/setup-python is not
        # something this task could reliably verify (couldn't run GitHub Actions
        # locally, and available research was inconsistent) - add it in a
        # follow-up once it's confirmed to actually work here.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: pytest (unit tests; SITL tests skip without DRONEKIT_TEST_CONNECTION)
        run: pytest dronekit/test -q

  sitl:
    name: sitl (ArduPilot SITL, best-effort)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Uses ArduPilot's own official prebuilt SITL binary
    # (firmware.ardupilot.org/Copter/stable/SITL_x86_64_linux_gnu/arducopter -
    # verified reachable, HTTP 200, ~7 MB) instead of cloning the whole
    # ardupilot repo with submodules and building it with waf, which used to
    # take 15-25+ minutes here and was the reason this job needed a 45-minute
    # timeout. "stable" is ArduPilot's floating current-stable-release alias
    # (this firmware server does not publish SITL binaries under fixed
    # per-tag paths, only under the stable/latest/beta channels - a fixed
    # Copter-4.6.3 SITL binary path returns 404), so the exact ArduCopter
    # version this job tests against can drift forward release to release.
    # That's an accepted trade-off for how much faster and simpler this makes
    # the job; still continue-on-error since a live pytest run against it has
    # never actually been observed to pass in this repo's CI yet.
    #
    # Running the binary directly (no sim_vehicle.py/MAVProxy wrapper) means
    # it listens on plain TCP, not UDP: SERIAL0 defaults to TCP port 5760
    # (5760 + 10 * instance number), which is why DRONEKIT_TEST_CONNECTION
    # here is tcp:127.0.0.1:5760, not a udp: string like earlier attempts at
    # this job used.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dronekit2 with dev dependencies
        run: pip install -e ".[dev]"

      - name: Download prebuilt ArduCopter SITL binary
        run: |
          curl -fsSL -o arducopter \
            https://firmware.ardupilot.org/Copter/stable/SITL_x86_64_linux_gnu/arducopter
          chmod +x arducopter

      - name: Launch ArduCopter SITL in the background
        run: |
          nohup ./arducopter --model quad --instance 0 --speedup 1 \
            --home -35.363261,149.165230,584,353 --wipe \
            > /tmp/arducopter.log 2>&1 &
          disown

      - name: Wait for SITL to come up (TCP heartbeat on 127.0.0.1:5760)
        run: |
          python -c "
          import sys, time
          from pymavlink import mavutil

          # History of this step, confirmed against three real CI runs (not
          # guessed each time - reasoned from the actual server+client log
          # output after every attempt):
          #  1) Original bug: pymavlink's mavtcp defaults to
          #     autoreconnect=False, so its internal handle_eof()/reconnect()
          #     is a no-op on a dead socket, and wait_heartbeat()'s blocking
          #     select()-based loop reports an EOF'd socket 'readable'
          #     forever - a zero-delay busy loop that spammed ~220k log lines.
          #  2) Switched to recv_match(blocking=False) in a manually-paced
          #     loop (bounds any spam to our own explicit sleep) and added a
          #     GCS heartbeat_send(), reasoning ArduPilot's serial-over-TCP
          #     emulation might treat a silent read-only client as a dead
          #     line. The spam dropped to a handful of lines (fix worked),
          #     but the connection still died almost immediately even with
          #     heartbeats being sent - so that wasn't the (whole) story.
          #  3) The real remaining bug was in THIS script, not the server:
          #     when pymavlink's handle_eof()/handle_disconnect() fires, it
          #     does not raise - it just prints and returns. The old loop's
          #     'if conn is None: reconnect' guard therefore never re-fired
          #     once the first connection object existed, even after that
          #     connection was long dead - it just kept polling the same
          #     corpse every 0.2s until the outer deadline, never trying a
          #     fresh TCP connection again.
          #
          # This version fixes #3: every outer iteration is its own short
          # "session" against a brand new connection object, unconditionally
          # closed in a finally block, regardless of whether an exception
          # was raised or handle_eof() just silently gave up. If ArduPilot
          # really does drop every single connection quickly, this at least
          # produces many 'Connection on serial port 5760' lines to look at
          # next, instead of hiding behind one dead, endlessly-reused object.
          deadline = time.time() + 60
          msg = None
          session_n = 0
          while time.time() < deadline and msg is None:
              session_n += 1
              conn = None
              try:
                  conn = mavutil.mavlink_connection('tcp:127.0.0.1:5760')
                  session_deadline = time.time() + 3
                  last_heartbeat_sent = 0.0
                  while time.time() < session_deadline and msg is None:
                      now = time.time()
                      if now - last_heartbeat_sent > 1:
                          conn.mav.heartbeat_send(mavutil.mavlink.MAV_TYPE_GCS, mavutil.mavlink.MAV_AUTOPILOT_INVALID, 0, 0, 0)
                          last_heartbeat_sent = now
                      msg = conn.recv_match(type='HEARTBEAT', blocking=False)
                      if msg is None:
                          time.sleep(0.2)
              except (ConnectionRefusedError, ConnectionResetError, BrokenPipeError, OSError) as e:
                  print(f'session {session_n}: {e!r}')
              finally:
                  if conn is not None:
                      conn.close()
              if msg is None:
                  time.sleep(0.5)
          print(f'{session_n} connection session(s) attempted')
          if msg is None:
              print('Timed out waiting for a heartbeat from SITL', file=sys.stderr)
              sys.exit(1)
          print('Got heartbeat from SITL:', msg)
          "

      - name: pytest -m sitl against live SITL
        env:
          DRONEKIT_TEST_CONNECTION: "tcp:127.0.0.1:5760"
        run: pytest dronekit/test -q -m sitl

      - name: SITL log (always, for debugging)
        if: always()
        run: cat /tmp/arducopter.log || true

  docs:
    name: docs (sphinx)
    runs-on: ubuntu-latest
    # sphinx_3dr_theme (dead) was replaced with furo in E8; the two warnings
    # `-W` used to trip on (a stale :emphasize-lines: range in
    # dronekit/mission.py's CommandSequence docstring, and a toctree entry
    # for docs/examples/performance_test.rst that didn't exist yet) are both
    # fixed, so this is now a real, blocking gate rather than provisional.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: pip install -e ".[docs]"

      - name: sphinx-build
        run: sphinx-build -W -b html docs docs/_build/html
