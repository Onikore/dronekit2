name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    # A follow-up task cleaned up the ~580 pre-existing violations this job
    # used to continue-on-error past; `ruff check .` is now a real, blocking
    # gate. The one line ruff itself cannot wrap (a long ArduPilot wiki URL
    # inside Command's RST docstring, in dronekit/mission.py) is scoped out
    # via pyproject.toml's [tool.ruff.lint.per-file-ignores], not this flag.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    # PROVISIONAL: best-effort only. The codebase has no inline type annotations
    # and this is the first time mypy has ever run in CI here, so a hard gate
    # would be premature even though it currently passes cleanly with the
    # permissive [tool.mypy] settings in pyproject.toml (ignore_missing_imports).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: mypy dronekit/
        run: mypy dronekit/

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.14: left out deliberately. Support in actions/setup-python is not
        # something this task could reliably verify (couldn't run GitHub Actions
        # locally, and available research was inconsistent) - add it in a
        # follow-up once it's confirmed to actually work here.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: pytest (unit tests; SITL tests skip without DRONEKIT_TEST_CONNECTION)
        run: pytest dronekit/test -q

  sitl:
    name: sitl (ArduPilot SITL, best-effort)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # UNVERIFIED / PROVISIONAL: this is new infra that has never run in this
    # repo's CI before, and it could not be exercised locally (no Docker here,
    # dronekit-sitl's own binary host 404s - see dronekit/test/conftest.py).
    # It builds ArduPilot from source at a pinned stable tag and launches
    # sim_vehicle.py directly rather than a Docker image, because the
    # community SITL Docker images found during research (radarku/ardupilot-sitl,
    # sitin/ardupilot-sitl) only expose a TCP MAVLink port (5760), not the UDP
    # port this job wants to bind DRONEKIT_TEST_CONNECTION to, and their
    # maintenance status is uncertain. Marked continue-on-error so a broken or
    # flaky SITL bring-up never blocks the rest of CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dronekit2 with dev dependencies
        run: pip install -e ".[dev]"

      - name: Clone ArduPilot (pinned to Copter-4.6.3) with submodules
        run: |
          git clone --recurse-submodules --depth 1 --branch Copter-4.6.3 \
            https://github.com/ArduPilot/ardupilot.git ../ardupilot

      - name: Install ArduPilot build prerequisites
        working-directory: ../ardupilot
        run: |
          Tools/environment_install/install-prereqs-ubuntu.sh -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build ArduCopter SITL
        working-directory: ../ardupilot
        run: |
          ./waf configure --board sitl
          ./waf build --target bin/arducopter

      - name: Launch ArduCopter SITL in the background
        working-directory: ../ardupilot
        run: |
          nohup Tools/autotest/sim_vehicle.py -v ArduCopter --no-mavproxy \
            --no-rebuild -w --out=udp:127.0.0.1:14550 \
            > /tmp/sim_vehicle.log 2>&1 &
          disown

      - name: Wait for SITL to come up (UDP heartbeat on 127.0.0.1:14550)
        run: |
          python -c "
          import sys, time
          from pymavlink import mavutil
          deadline = time.time() + 180
          conn = mavutil.mavlink_connection('udpin:127.0.0.1:14550')
          msg = None
          while time.time() < deadline and msg is None:
              msg = conn.wait_heartbeat(timeout=5)
          if msg is None:
              print('Timed out waiting for a heartbeat from SITL', file=sys.stderr)
              sys.exit(1)
          print('Got heartbeat from SITL:', msg)
          conn.close()
          "

      - name: pytest -m sitl against live SITL
        env:
          DRONEKIT_TEST_CONNECTION: "udp:127.0.0.1:14550"
        run: pytest dronekit/test -q -m sitl

      - name: SITL log (always, for debugging)
        if: always()
        run: cat /tmp/sim_vehicle.log || true

  docs:
    name: docs (sphinx)
    runs-on: ubuntu-latest
    # PROVISIONAL: docs/conf.py depends on sphinx_3dr_theme, which is dead
    # (unmaintained, not installable in a way this task can rely on). Fixing
    # that is out of scope for this CI migration - a later task replaces the
    # theme. Kept as continue-on-error so the job still runs and reports
    # real status rather than being silently skipped.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: pip install -e ".[docs]"

      - name: sphinx-build
        run: sphinx-build -W -b html docs docs/_build/html
