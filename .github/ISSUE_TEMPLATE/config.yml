blank_issues_enabled: false
contact_links:
  - name: Usage question / "how do I...?"
    url: https://github.com/Onikore/dronekit2/issues
    about: >
      GitHub Discussions is not enabled on this repo yet; for now, general usage questions are
      welcome as regular issues too - just say up front it's a question, not a bug report.
  - name: Security vulnerability
    url: https://github.com/Onikore/dronekit2/security
    about: >
      Please do not report security vulnerabilities through public issues - see SECURITY.md for
      the reporting process.
